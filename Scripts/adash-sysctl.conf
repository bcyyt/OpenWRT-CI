# luci-app-adash: conntrack 超时收紧（爱快式无心跳连接加速清理）
# established 是"无流量计时器"：每个数据包都会重置它，只有完全静默的连接才倒数归零被清。
# 带心跳保活的长连接（微信推送/SSH keepalive）不受影响，被清的只是真正挂死的连接。
net.netfilter.nf_conntrack_tcp_timeout_established=600
# time_wait→30s：关闭侧快速回收
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
# fin_wait/close_wait/last_ack 一并压缩：半关闭连接快速出表
net.netfilter.nf_conntrack_tcp_timeout_fin_wait=60
net.netfilter.nf_conntrack_tcp_timeout_close_wait=30
net.netfilter.nf_conntrack_tcp_timeout_last_ack=30
# UDP 流式(视频/游戏) 180→120s：无流量 UDP 会话更快回收
net.netfilter.nf_conntrack_udp_timeout_stream=120
