name: Cache-Clean

on:
  #定时清理：每周日北京时间 06:30（UTC 22:30）
  schedule:
    - cron: '30 22 * * 0'
  #手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: gh cache delete --all
