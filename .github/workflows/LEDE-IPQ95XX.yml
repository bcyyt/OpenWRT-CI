# SPDX-License-Identifier: MIT
# LEDE(coolsnowwolf/lede) IPQ95XX 线：SBE1V1K 双配置(全功能 + 纯有线)，手动触发
# 2026-11-21: 仪表盘系组件仅 v 主题线注入，本线 bootstrap 主题不编入(Packages.sh 已按主题守卫)
name: LEDE-IPQ95XX

on:
  #定时编译：每天北京时间 05:30（UTC 21:30，QCB-ALL 后半小时错峰防排队）
  schedule:
    - cron: '30 3 * * *'
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        #LEDE 全功能线 + 纯有线线（SBE1V1K 专用，无线栈全剥离，同 owrt 线模式）
        CONFIG: [LEDE-IPQ95XX, LEDE-IPQ95XX-WIFI-NO]
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题(bootstrap: lede 旧 LuCI 零风险)
      WRT_THEME: bootstrap
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/coolsnowwolf/lede.git
      #源码分支
      WRT_BRANCH: master
      #源码名称
      WRT_SOURCE: coolsnowwolf/lede
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
