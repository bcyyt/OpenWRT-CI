#LEDE(coolsnowwolf/lede) IPQ95XX 线：SBE1V1K 单设备，手动触发
#2026-11-21 新增：lede 老线源码对照/备胎线(daed 缺失由 OpenClash 补位, 主题 bootstrap)
name: LEDE-IPQ95XX

on:
  #手动编译(不设定时：按需触发, 节省 Actions 时长)
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: LEDE-IPQ95XX
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: LEDE-IPQ95XX
      #默认主题(lede 旧 LuCI 兼容线，零风险)
      WRT_THEME: bootstrap
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/coolsnowwolf/lede.git
      #源码分支
      WRT_BRANCH: master
      #源码名称
      WRT_SOURCE: coolsnowwolf/lede
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
