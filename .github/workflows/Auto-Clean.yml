name: Auto-Clean

on:
  #定时清理：每天北京时间 06:00（UTC 22:00，两线固件编译完成后）
  schedule:
    - cron: '0 22 * * *'
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #Release 精简：4 条编译线每线只保留 2 个最新固件
      #（每个配置各保 1 最新防清零，再按时间补足到 2；Release 连 tag 一并删除）
      - name: Trim releases to 2 per line
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: python3 .github/scripts/release-keep.py

      - name: Delete old Workflow runs
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: false
          delete_workflows: true
          #workflow运行记录保留3天
          workflows_keep_day: 3
