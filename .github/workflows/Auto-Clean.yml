name: Auto-Clean

on:
  #自动清理：每天早上4点（北京时间，UTC 20:00），完成后自动触发 OWRT-ALL(X86) 与 MTK-ALL 编译
  schedule:
    - cron: 0 20 * * *
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          #固件Release保留3天（删除3天前的），替代原来的全删策略
          releases_keep_day: 3
          delete_tags: true
          delete_workflows: true
          #workflow运行记录同样保留3天
          workflows_keep_day: 3
